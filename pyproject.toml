[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lcp-protocol"
dynamic = ["version"]
description = "Reference implementation of the Lightweight Communication Protocol (LCP) v1.3.0: 16-byte binary header, TLV metadata and JSON/Protobuf/raw payloads over TCP/TLS."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "LCP Protocol contributors" }]
keywords = ["lcp", "protocol", "rpc", "asyncio", "tcp", "tls", "tlv", "binary-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
protobuf = ["protobuf>=4.21"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "trustme>=1.1",
  "protobuf>=4.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
]

[project.scripts]
lcp = "lcp.cli:main"

[tool.hatch.version]
path = "src/lcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/benchmarks",
  "/scripts",
  "/README.md",
  "/README.en.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/Makefile",
  "/Makefile.win",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
timeout = 60
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/lcp"]
warn_unreachable = true

[tool.coverage.run]
source = ["lcp"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
